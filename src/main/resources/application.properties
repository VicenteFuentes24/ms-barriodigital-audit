spring.application.name=ms-audit
server.port=${SERVER_PORT:8084}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${AUDIT_MIGRATIONS_ENABLED:false}
spring.flyway.default-schema=bd_audit
spring.flyway.schemas=bd_audit
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
spring.kafka.consumer.group-id=${KAFKA_AUDIT_GROUP_ID:bd-audit-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.consumer.properties[max.poll.interval.ms]=300000
spring.kafka.consumer.properties[request.timeout.ms]=30000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_ENABLED:true}
spring.kafka.listener.concurrency=1
spring.kafka.admin.auto-create=false
audit.events-topic=bd.requests.events.v1
audit.consumer-retries=${KAFKA_CONSUMER_RETRIES:3}
audit.retry-delay-ms=${KAFKA_RETRY_DELAY_MS:1000}
audit.query-zone=${AUDIT_QUERY_ZONE:America/Santiago}
audit.security.tenant-id=${AZURE_TENANT_ID:}
audit.security.audience=${AZURE_API_AUDIENCE:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
# Avoid framework logs containing SQL parameters, record payloads or exception messages.
logging.level.org.springframework.kafka.listener.DefaultErrorHandler=OFF
logging.level.org.apache.kafka.clients.consumer.internals=ERROR
logging.level.org.hibernate.orm.jdbc.error=OFF
